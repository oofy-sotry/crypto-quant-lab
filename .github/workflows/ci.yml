name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.11"
      - run: ruff check .
      - run: ruff format --check .

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # 로컬 docker compose와 같은 PostgreSQL·Redis를 띄운다. 테스트는 진짜 PostgreSQL에서 돌아야
    # unique 제약·upsert·타임존 같은 DB 동작까지 검증된다(SQLite로 바꾸면 놓친다).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cryptoquant
          POSTGRES_USER: cryptoquant
          POSTGRES_PASSWORD: cryptoquant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cryptoquant -d cryptoquant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-only-not-secret
      # POSTGRES_USER로 만든 사용자는 슈퍼유저라 test_ DB를 만들 수 있다(MySQL 때의 root 접속이 필요 없음).
      DATABASE_URL: postgres://cryptoquant:cryptoquant@127.0.0.1:5432/cryptoquant
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
