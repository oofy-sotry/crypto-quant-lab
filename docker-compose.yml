services:
  postgres:
    image: postgres:16
    # POSTGRES_USER로 만든 사용자는 슈퍼유저라 Django 테스트 러너가 test_ DB를 만들고 지울 수 있다.
    environment:
      POSTGRES_DB: ${DB_NAME:-cryptoquant}
      POSTGRES_USER: ${DB_USER:-cryptoquant}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cryptoquant}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-cryptoquant}", "-d", "${DB_NAME:-cryptoquant}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  postgres-data:
